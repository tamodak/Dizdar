# Project-wide Gradle settings.
#
# Android Studio's own settings override these, so a build that behaves differently in the IDE than
# on the command line is usually a difference configured there rather than here.
# https://www.gradle.org/docs/current/userguide/build_environment.html

# Daemon heap. 2 GB is comfortable for a single-module project; the Compose compiler is the part
# that would want more, and it has not needed it.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel execution is off because it buys nothing here: there is one module, so there is nothing
# to run in parallel with.
# org.gradle.parallel=true

# Skips the configuration phase outright when nothing affecting it has changed. Worth having on a
# project this small precisely because the configuration phase is a large share of a no-op build.
org.gradle.configuration-cache=true

# "official" is the Kotlin style guide's own formatting, which is what the codebase follows.
kotlin.code.style=official
